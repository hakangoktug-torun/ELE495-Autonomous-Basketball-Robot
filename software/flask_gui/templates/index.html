<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ELE495 &middot; Robot Kontrol Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand">
                <p class="eyebrow">ELE495 &middot; Grup 9</p>
                <h1>Robot Kontrol Paneli</h1>
            </div>
            <div class="status-cluster">
                <div class="connection" id="connection">baglaniyor&hellip;</div>
                <div class="mode-badge mode-idle" id="mode-badge">
                    <span class="status-dot"></span>
                    <span id="mode-text">HAZIR DEGIL</span>
                </div>
            </div>
        </header>

        <section class="scoreboard" aria-label="Skor tablosu">
            <div class="scoreboard-score">
                <span class="scoreboard-label">TOPLAM PUAN</span>
                <strong id="score">0</strong>
            </div>
            <div class="scoreboard-strip dort-sutun">
                <div class="strip-cell">
                    <span>BAGLANTI</span>
                    <strong id="baglanti-durumu">-</strong>
                </div>
                <div class="strip-cell">
                    <span>TEST</span>
                    <strong id="test-durumu">beklemede</strong>
                </div>
                <div class="strip-cell">
                    <span>BASARILI GECIS</span>
                    <strong id="gecis-sayisi">0</strong>
                </div>
                <div class="strip-cell" id="sure-hucresi">
                    <span>KALAN SURE</span>
                    <strong id="kalan-sure">5:00</strong>
                </div>
            </div>
        </section>

        <section class="pozisyon-panel" id="pozisyon-panel" aria-label="Aktif pozisyon durumu">
            <div class="pozisyon-sayac">
                <span class="pozisyon-sayac-label">POZISYON</span>
                <strong id="pozisyon-sayac">-</strong>
            </div>
            <div class="pozisyon-detay">
                <div class="pozisyon-etiket-satir">
                    <span id="pozisyon-etiket">Test baslamadi</span>
                    <span class="bolge-rozeti" id="bolge-rozeti" hidden></span>
                </div>
                <p class="pozisyon-asama" id="pozisyon-asama"></p>
            </div>
        </section>

        <section class="dashboard-grid">
            <article class="panel control-panel">
                <h2>Kontrol</h2>
                <button class="btn btn-auto btn-wide" id="baslat-btn">Testi Baslat</button>
                <button class="btn btn-emergency btn-wide" id="emergency">Acil Durdur</button>
                <p class="warn-text" id="baglanti-hata"></p>
            </article>

            <article class="panel input-panel" id="esc-panel" hidden>
                <h2>ESC Hizi</h2>
                <p id="esc-bilgisi" class="hint"></p>
                <div class="input-row">
                    <label>
                        Guncel Hiz (%)
                        <input type="number" id="esc-hiz-input" min="0" max="100" step="0.1" value="12.4">
                    </label>
                </div>
                <button class="btn btn-score btn-wide" id="esc-gonder-btn">ESC Hizini Gonder</button>
                <p class="hint" id="esc-guncel-deger"></p>
            </article>

            <article class="panel history-panel">
                <h2>Hareket / Atis Kaydi</h2>
                <ol id="task-history" class="history-list" aria-live="polite"></ol>
            </article>
        </section>
    </main>

    <script>
        async function postJson(url, body = {}) {
            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(body)
                });
                const payload = await response.json();
                if (!response.ok && payload.hata) {
                    document.getElementById("baglanti-hata").textContent = payload.hata;
                    return;
                }
                renderStatus(payload);
            } catch (error) {
                setConnection(false);
                document.getElementById("baglanti-hata").textContent = "Sunucudan gecerli cevap alinamadi.";
            }
        }

        async function refreshStatus() {
            try {
                const response = await fetch("/api/durum");
                renderStatus(await response.json());
                setConnection(true);
            } catch (error) {
                setConnection(false);
            }
        }

        function renderStatus(status) {
            document.getElementById("score").textContent = status.score;
            document.getElementById("baglanti-durumu").textContent =
                status.baglanti_hazir ? "hazir" : "bekleniyor";
            document.getElementById("test-durumu").textContent =
                status.baslatiliyor ? "baslatiliyor" : (status.calisiyor ? "calisiyor" : "beklemede");
            document.getElementById("gecis-sayisi").textContent =
                status.gecis_sayisi != null ? status.gecis_sayisi : 0;

            updateSureGostergesi(status);

            document.getElementById("baglanti-hata").textContent = status.baglanti_hata_mesaji || "";

            updateModeBadge(status);
            updateEscPanel(status.esc);
            updatePozisyonPanel(status.aktif_pozisyon);

            const history = document.getElementById("task-history");
            history.innerHTML = "";
            (status.gecmis || []).forEach((item) => {
                const row = document.createElement("li");
                const parts = item.split(" - ");
                const time = document.createElement("span");
                const message = document.createElement("span");
                time.className = "history-time";
                time.textContent = `[${parts[0]}]`;
                message.textContent = parts.slice(1).join(" - ") || item;
                row.append(time, message);
                history.appendChild(row);
            });
        }

        // YENI: Robotun su anki pozisyonunu/bolgesini genel loglardan AYRI
        // olarak, ozel bir panelde gosterir. status.aktif_pozisyon backend'de
        // durum_fn callback'i uzerinden guncelleniyor (bkz. app.py).
        const ASAMA_METINLERI = {
            beklemede: "Test baslamadi",
            baslatiliyor: "Test baslatiliyor...",
            atis: "Atis pozisyonunda - sweep yapiliyor",
            hareket: "Sonraki pozisyona hareket ediliyor",
            tamamlandi: "Test tamamlandi",
            durduruldu: "Durduruldu",
            hata: "Hata olustu",
        };

        // YENI: 5 dakikalik geri sayimi mm:ss formatinda gosterir. Backend
        // (app.py / app_esc_interaktif.py) status.kalan_sure_sn'i her
        // /api/durum cevabinda gonderiyor - burada sadece formatlayip
        // gosteriyoruz, geri sayim mantigi tamamen backend'de (5 dakika
        // dolunca backend otomatik Acil Durdur tetikliyor).
        function formatSure(saniye) {
            const toplamSaniye = Math.max(0, Math.round(saniye));
            const dakika = Math.floor(toplamSaniye / 60);
            const kalanSaniye = toplamSaniye % 60;
            return `${dakika}:${String(kalanSaniye).padStart(2, "0")}`;
        }

        function updateSureGostergesi(status) {
            const hucre = document.getElementById("sure-hucresi");
            const metin = document.getElementById("kalan-sure");
            const kalanSn = status.kalan_sure_sn != null ? status.kalan_sure_sn : 300;

            metin.textContent = formatSure(kalanSn);

            hucre.classList.remove("sure-uyari", "sure-kritik");
            if (kalanSn <= 30) {
                hucre.classList.add("sure-kritik");
            } else if (kalanSn <= 60) {
                hucre.classList.add("sure-uyari");
            }
        }

        function updatePozisyonPanel(pozisyon) {
            const panel = document.getElementById("pozisyon-panel");
            const sayac = document.getElementById("pozisyon-sayac");
            const etiket = document.getElementById("pozisyon-etiket");
            const asamaEl = document.getElementById("pozisyon-asama");
            const rozet = document.getElementById("bolge-rozeti");

            if (!pozisyon) {
                sayac.textContent = "-";
                etiket.textContent = "Test baslamadi";
                asamaEl.textContent = "";
                rozet.hidden = true;
                panel.className = "pozisyon-panel";
                return;
            }

            sayac.textContent = pozisyon.pozisyon_no
                ? `${pozisyon.pozisyon_no} / ${pozisyon.toplam_pozisyon || "?"}`
                : "-";
            etiket.textContent = pozisyon.etiket || "-";
            asamaEl.textContent = ASAMA_METINLERI[pozisyon.asama] || pozisyon.asama || "";

            // Bolge rozeti - kirmizi/yesil renk kodlamasi
            if (pozisyon.bolge) {
                rozet.hidden = false;
                const puanMetni = pozisyon.puan != null ? ` (${pozisyon.puan} puan)` : "";
                rozet.textContent = pozisyon.bolge.split(" (")[0] + puanMetni;
                rozet.className = "bolge-rozeti";
                if (pozisyon.bolge.startsWith("KIRMIZI")) {
                    rozet.classList.add("bolge-kirmizi");
                } else if (pozisyon.bolge.startsWith("YESIL")) {
                    rozet.classList.add("bolge-yesil");
                } else {
                    rozet.classList.add("bolge-bilinmiyor");
                }
            } else {
                rozet.hidden = true;
            }

            // Panel arka planini asamaya gore vurgula
            panel.className = "pozisyon-panel";
            if (pozisyon.asama === "atis") {
                panel.classList.add("pozisyon-aktif");
            } else if (pozisyon.asama === "hareket") {
                panel.classList.add("pozisyon-hareket");
            } else if (pozisyon.asama === "tamamlandi") {
                panel.classList.add("pozisyon-tamamlandi");
            } else if (pozisyon.asama === "durduruldu" || pozisyon.asama === "hata") {
                panel.classList.add("pozisyon-durduruldu");
            }
        }

        // status.esc SADECE app_esc_interaktif.py kullaniliyorsa gelir
        // (interaktif ESC surumu). app.py ile calisiyorsan bu alan yok -
        // panel gizli kalir, otomatik/sabit ESC hizi kullanilir.
        function updateEscPanel(esc) {
            const panel = document.getElementById("esc-panel");
            const bilgi = document.getElementById("esc-bilgisi");
            const guncelDeger = document.getElementById("esc-guncel-deger");

            if (!esc) {
                panel.hidden = true;
                return;
            }

            panel.hidden = false;

            if (esc.ilk_deger_bekleniyor) {
                bilgi.textContent = `${esc.aktif_etiket || "Pozisyon"} - ESC hizi bekleniyor, lutfen deger girip gonder.`;
                panel.classList.add("esc-bekleniyor");
            } else {
                bilgi.textContent = "Sweep calisiyor - istedigin an yeni bir deger gonderip hizi degistirebilirsin.";
                panel.classList.remove("esc-bekleniyor");
            }

            guncelDeger.textContent = `Su anki ESC hizi: %${Number(esc.hiz).toFixed(1)}`;
        }

        function setConnection(isConnected) {
            const connection = document.getElementById("connection");
            connection.textContent = isConnected ? "bagli" : "baglanti yok";
            connection.className = isConnected ? "connection connected" : "connection disconnected";
        }

        function updateModeBadge(status) {
            const badge = document.getElementById("mode-badge");
            const text = document.getElementById("mode-text");
            badge.className = "mode-badge";

            if (status.baglanti_hata_mesaji) {
                badge.classList.add("mode-danger");
                text.textContent = "HATA";
            } else if (status.baslatiliyor) {
                badge.classList.add("mode-waiting");
                text.textContent = "BASLATILIYOR";
            } else if (status.esc && status.esc.ilk_deger_bekleniyor) {
                badge.classList.add("mode-waiting");
                text.textContent = "ESC HIZI BEKLENIYOR";
            } else if (status.calisiyor) {
                badge.classList.add("mode-auto");
                text.textContent = "CALISIYOR";
            } else if (status.baglanti_hazir) {
                badge.classList.add("mode-ready");
                text.textContent = "HAZIR";
            } else {
                text.textContent = "HAZIR DEGIL";
            }
        }

        document.getElementById("baslat-btn").addEventListener("click", () => {
            postJson("/api/atis-testi/baslat");
        });

        document.getElementById("esc-gonder-btn").addEventListener("click", () => {
            const hiz = Number(document.getElementById("esc-hiz-input").value);
            postJson("/api/esc-hiz", {hiz});
        });

        document.getElementById("emergency").addEventListener("click", () => {
            postJson("/api/emergency-stop");
        });

        refreshStatus();
        setInterval(refreshStatus, 700);
    </script>
</body>
</html>
